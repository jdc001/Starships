function loValue(lo){let v=HULLS[lo.hull].price;for(const k in lo.upg)for(let l=0;l<lo.upg[k];l++)v+=UPC[l];
 for(let i=0;i<(lo.extra||0);i++)v+=MC[i];for(const m of lo.mounts)v+=mountVal(m);for(const k of lo.mods)v+=MODS[k].price;return v;}

function genEnemy(B,emp){const E=EMP[emp]||EMP.kesh,wp=()=>Math.random()<.7?pick(E.wpn):pick(WTYPES);
 const elig=HORDER.filter(k=>HULLS[k].price<=B*.72);let hk=elig.length?elig[elig.length-1]:'kestrel';
 if(elig.length>1&&Math.random()<.35)hk=elig[elig.length-2];
 const lo=newLo(hk);lo.mounts.forEach(m=>{if(Math.random()<.35)m.t=wp();});
 let rem=B-loValue(lo);
 for(let it=0;it<80;it++){const o=[];
  for(const k in lo.upg)if(lo.upg[k]<4)o.push({c:UPC[lo.upg[k]],f:()=>lo.upg[k]++});
  lo.mounts.forEach(m=>{if(m.t&&m.tier<3)o.push({c:TIERC[m.tier-1],f:()=>m.tier++});if(!m.t){const t=wp();o.push({c:WD[t].price,f:()=>{m.t=t;m.tier=1;}});}});
  if(lo.extra<2)o.push({c:MC[lo.extra],f:()=>{lo.extra++;lo.mounts.push({t:null,tier:1,stock:0});}});
  if(lo.mods.length<HULLS[hk].mods){const pf=E.mods.filter(k=>!lo.mods.includes(k)),ks=Object.keys(MODS).filter(k=>!lo.mods.includes(k));const k=pf.length&&Math.random()<.75?pick(pf):pick(ks);o.push({c:MODS[k].price,f:()=>lo.mods.push(k)});}
  const af=o.filter(x=>x.c<=rem);if(!af.length)break;const x=pick(af);x.f();rem-=x.c;}
 lo.mounts.forEach(m=>{if(!m.t){m.t=wp();}if(m.t==='torp'&&!m.v)m.v=Math.random()<.6?E.tv:pick(['fusion','anti','grav']);});

function genPlanets(){

 for(let i=0;i<n;i++){for(let k=0;k<40;k++){const q={t:Math.random()*4|0,r:rand(95,170),x:rand(-2300,2300),y:rand(-2300,2300)};
  if(Math.hypot(q.x,q.y)+q.r>ARENA-300)continue;if(Math.hypot(Math.abs(q.x)-1550,q.y)<q.r+400)continue;
  if(ps.every(o=>Math.hypot(o.x-q.x,o.y-q.y)>o.r+q.r+400)){ps.push(q);break;}}}
 return ps;
}
function genNebulae(pl){
 const n=3+(Math.random()*4|0),ns=[];
 for(let i=0;i<n;i++){for(let k=0;k<50;k++){const q={r:rand(260,440),x:rand(-2900,2900),y:rand(-2900,2900),h:Math.random()<.5?0:1};
  if(Math.hypot(q.x,q.y)+q.r>ARENA)continue;if(Math.hypot(Math.abs(q.x)-1550,q.y)<q.r+250)continue;

}
// a contract: fight for `client` to take sector `sid` from its owner
function contract(sid,client){
 const g=save.g,key=sid+':'+client;if(g.offers[key])return g.offers[key];
 const S=SECT[sid],foe=g.own[sid],sf=shareOf(foe),sc=shareOf(client);
 // the map sets a floor; each ring also keeps pace with your ship, so the core always outclasses you and the rim never does
 const PS=2.5,mapB=PS*(300+S.val*S.val*350+sf*4000+g.n*60),pv=loValue(save.lo),relB=pv*[1.3,.95,.7,.45][S.r]*(.85+sf*.9);
 let B=Math.max(mapB,relB);if(repOf(foe)<=-60)B*=1.25;if(sc>.4)B*=1.2;
 const st=relB>mapB?clamp([3,2,1,1][S.r]+(sf>.3?1:0)+(repOf(foe)<=-60?1:0),1,4):clamp(Math.round(1+(B/PS-1500)/2000),1,4);
 const lo=genEnemy(B,foe),ev=loValue(lo),pl=genPlanets();
 const reward=Math.round(((mapB/PS*.3+130)*(1+.15*(S.val-1))*(sf>.4?1.3:1)+Math.max(0,B-mapB)/PS*.08)/10)*10;
 return g.offers[key]={sid,client,foe,lo,ev,st,pl,nb:genNebulae(pl),pers:EMP[foe].pers,reward,marked:repOf(foe)<=-60,coal:sf>.4,
  name:pick(OPS)+' · '+S.name};
}
function contractsFor(sid){const g=save.g,o=g.own[sid];const cl=[...new Set(nbrs(sid).map(n=>g.own[n]).filter(e=>e!==o))];return cl.map(c=>({client:c,refuses:repOf(c)<=-40}));}
function repGain(e,v){const g=3+2*v;return repOf(e)>=50?Math.ceil(g/2):g;}
function repAdd(e,d,ch){const g=save.g,b=g.rep[e]||0;g.rep[e]=clamp(Math.round(b+d),-100,100);if(ch&&g.rep[e]!==b)ch.push([e,g.rep[e]-b]);}

function discount(){let b=0;for(const e of EORD)if(repOf(e)>=40)b=Math.max(b,shareOf(e)*40);return Math.min(25,Math.round(b));}

// the rest of the galaxy fights while you're busy
function galDrift(lines){const g=save.g;
 for(let k=0;k<2;k++){const pairs=[];for(let i=0;i<SECT.length;i++)for(const n of nbrs(i))if(g.own[i]!==g.own[n])pairs.push([i,n]);if(!pairs.length)return;
  const[a,b]=pick(pairs),att=g.own[a],def=g.own[b],sa=shareOf(att),sd=shareOf(def);
  let p=clamp(.5+(sa-sd)*.6,.25,.7);if(sa>.4)p*=.6;if(sd>.4)p=Math.min(.8,p*1.3);
  if(Math.random()<p){g.own[b]=att;lines.push(`<span style="color:${EMP[att].col}">${EMP[att].short}</span> took ${SECT[b].name} from the <span style="color:${EMP[def].col}">${EMP[def].short}</span>`);
   if(!alive(def))lines.push(`<b style="color:${EMP[def].col}">The ${EMP[def].name} has fallen.</b>`);}
  else lines.push(`<span style="color:${EMP[def].col}">${EMP[def].short}</span> held ${SECT[b].name} against the <span style="color:${EMP[att].col}">${EMP[att].short}</span>`);}
}
function checkWin(){const g=save.g;if(g.won)return null;
 for(const e of EORD)if(repOf(e)>=50&&shareOf(e)>=2/3)return g.won={type:'conquest',e:[e]};

 if(g.n>=15&&al.length>=2&&al.every(e=>shareOf(e)>=.25)&&al.reduce((a,e)=>a+shareOf(e),0)>=.75)return g.won={type:'balance',e:al};

const COUNTER={strafe:'hold',orbit:'lance',lance:'lance',hold:'lance',evade:'strafe',about:'strafe'};
function choosePat(e,p){

 else if(threat)act='flank';

  case'about':aboutScreen();break;
  case'slotsave':try{localStorage.setItem(slotKey(arg),JSON.stringify({t:Date.now(),v:VERSION,data:save}));msg('SAVED TO SLOT '+arg,'#7dffb0');}catch(e){msg('COULD NOT SAVE','#ff6b5a');}savesScreen();break;
  case'slotload':show(`<h2>LOAD SLOT ${arg}?</h2><p style="font-size:12px;opacity:.8">This replaces your current campaign. Save it to another slot first if you want to keep it.</p><button class="btn" data-act="slotload2" data-arg="${arg}">LOAD</button><button class="btn alt" data-act="saves">CANCEL</button>`);break;
  case'slotload2':{const d=readSlot(arg),ok=d&&sanitize(d.data);if(!ok){msg('THAT SAVE COULD NOT BE READ','#ff6b5a');savesScreen();break;}save=ok;persist();gal.sel=-1;titleBack='hub';msg('LOADED SLOT '+arg,'#7dffb0');hub();break;}
  case'slotdel':try{localStorage.removeItem(slotKey(arg));}catch(e){}savesScreen();break;
  case'export':{const cb=$('#codebox');cb.value=btoa(unescape(encodeURIComponent(JSON.stringify(save))));cb.select&&cb.select();break;}
  case'copycode':{const v=$('#codebox').value;if(!v)break;try{navigator.clipboard.writeText(v).then(()=>msg('CODE COPIED','#7dffb0'),()=>msg('SELECT THE CODE AND COPY IT','#ffd166'));}catch(e){msg('SELECT THE CODE AND COPY IT','#ffd166');}break;}
  case'import':{let d=null;try{d=sanitize(JSON.parse(decodeURIComponent(escape(atob($('#codebox').value.trim())))));}catch(e){}
   if(!d){msg('THAT CODE ISN\'T A VALID SAVE','#ff6b5a');break;}save=d;persist();gal.sel=-1;titleBack='hub';msg('CAMPAIGN LOADED','#7dffb0');hub();break;}
  case'wipe':show(`<h2>DELETE EVERYTHING?</h2><p style="font-size:12px;opacity:.8">This erases your campaign, all save slots and your options from this device. It cannot be undone.</p><button class="btn" data-act="wipe2">DELETE</button><button class="btn alt" data-act="options">CANCEL</button>`);break;
  case'wipe2':try{localStorage.removeItem(KEY);for(let i=1;i<=SLOTS;i++)localStorage.removeItem(slotKey(i));localStorage.removeItem(OPT_KEY);}catch(e){}
   OPT={sound:true,vol:.7,shake:true,turn:6,fast:false,hints:true};applyOpt();try{localStorage.removeItem(OPT_KEY);}catch(e){}save=defSave();title();break;
    case'yard':yardTab='hulls';yard();$('#scrBox').scrollTop=0;break;
  case'tab':yardTab=arg;yard();$('#scrBox').scrollTop=0;break;
    case'hull':{if(!unlocked('hull',arg))return;const net=price(HULLS[arg].price)-tradeIn();if(net>save.credits)return;save.credits-=net;save.lo=newLo(arg);persist();msg('NEW SHIP: '+HULLS[arg].name.toUpperCase(),'#ffe066');yard();break;}
  case'upg':{const c=UPC[lo.upg[arg]];if(c>save.credits)return;save.credits-=c;lo.upg[arg]++;persist();yard();break;}
  case'tier':{const m=lo.mounts[+arg],c=TIERC[m.tier-1];if(c>save.credits)return;save.credits-=c;m.tier++;persist();yard();break;}
  case'setw':{const[i,t]=arg.split(':');if(!unlocked('wpn',t))return;const m=lo.mounts[+i],ref=Math.round(mountVal(m)*.5),c=WD[t].price;if(c>save.credits+ref)return;save.credits+=ref-c;lo.mounts[+i]={t,tier:1,stock:0};if(t==='torp')lo.mounts[+i].v='fusion';persist();yard();break;}
  case'setv':{const[i,v]=arg.split(':');if(!unlocked('tv',v))return;const m=lo.mounts[+i],c=TV[v].price-Math.round(tvOf(m).price*.5);if(c>save.credits)return;save.credits-=c;m.v=v;persist();yard();break;}
  case'mount':{const c=MC[lo.extra];if(c>save.credits)return;save.credits-=c;lo.extra++;lo.mounts.push({t:null,tier:1,stock:0});persist();yard();break;}
  case'buymod':{const M=MODS[arg];if(!unlocked('mod',arg))return;if(M.price>save.credits||lo.mods.length>=HULLS[lo.hull].mods)return;save.credits-=M.price;lo.mods.push(arg);persist();yard();break;}
  case'sellmod':{save.credits+=Math.round(MODS[arg].price/2);lo.mods=lo.mods.filter(k=>k!==arg);persist();yard();break;}
  case'resume':$('#scr').classList.remove('on');state=prevState;last=performance.now();break;
  case'retreat':$('#scr').classList.remove('on');endBattle(false,true);break;
  case'opt:sound':OPT.sound=!OPT.sound;applyOpt();optionsScreen();break;
  case'opt:vol-':OPT.vol=Math.max(0,Math.round((OPT.vol-.1)*10)/10);applyOpt();optionsScreen();break;
  case'opt:vol+':OPT.vol=Math.min(1,Math.round((OPT.vol+.1)*10)/10);applyOpt();optionsScreen();break;
  case'opt:shake':OPT.shake=!OPT.shake;applyOpt();optionsScreen();break;
  case'opt:turn4':case'opt:turn6':case'opt:turn8':OPT.turn=+a.slice(8);applyOpt();optionsScreen();break;
  case'opt:fast0':case'opt:fast1':OPT.fast=a==='opt:fast1';applyOpt();optionsScreen();break;
  case'opt:hints':OPT.hints=!OPT.hints;applyOpt();optionsScreen();break;
  case'reset':show(`<h2>RESET CAMPAIGN?</h2><p style="font-size:12px;opacity:.8">This wipes your credits, ship, reputation and the galaxy.</p><button class="btn" data-act="reset2">YES, RESET</button><button class="btn alt" data-act="hub">CANCEL</button>`);break;
  case'reset2':newGame();break;
 }
}
$('#scrBox').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg);});

/* ================= INPUT / LOOP ================= */
function setWP(e){if(state!=='plan'||!player||!player.alive)return;
 if(player.act==='fold'){let x=(e.clientX-camO.x)/cam.z,y=(e.clientY-camO.y)/cam.z;const r=Math.hypot(x,y);if(r>ARENA*.95){x*=ARENA*.95/r;y*=ARENA*.95/r;}player.foldTo={x,y};wpPulse=1;return;}
 if(enemy.alive&&!isOn(enemy,'cloak')){const ex=camO.x+enemy.x*cam.z,ey=camO.y+enemy.y*cam.z;if(Math.hypot(e.clientX-ex,e.clientY-ey)<Math.max(60,enemy.rad*cam.z+30)){if(player.ps.k==='manual')setPat(player,player.lastPat||defPat(player),true);player.thrAuto=true;wpPulse=1;return;}}
 let x=(e.clientX-camO.x)/cam.z,y=(e.clientY-camO.y)/cam.z;const r=Math.hypot(x,y);if(r>ARENA){x*=ARENA/r;y*=ARENA/r;}if(player.ps.k!=='manual'){setPat(player,'manual');msg('HELM · MANUAL COURSE','#5fe3ff');}player.wp.x=x;player.wp.y=y;player.wpDone=false;wpPulse=1;}
cvs.addEventListener('pointerdown',e=>{if(state==='galaxy'){galTap(e);return;}dragging=true;setWP(e);});
addEventListener('pointermove',e=>{if(dragging&&player&&player.ps.k==='manual')setWP(e);});
addEventListener('pointerup',()=>dragging=false);addEventListener('pointercancel',()=>dragging=false);
function measure(){if(state==='galaxy'){galGeom();return;}const t=$('#top').getBoundingClientRect(),b=$('#bot').getBoundingClientRect();if(!t.height)return;
 const ob=$('#orders');ob.style.setProperty('--ob',(H-b.top+6)+'px');const o=ob.getBoundingClientRect(),port=H>=W;
 hudTop=port?$('#trow').getBoundingClientRect().bottom:t.bottom;hudBot=port&&o.height?H-o.top:H-b.top;
 const ac=$('#acts').getBoundingClientRect();hudBotL=ac.height?H-ac.top+8:H*.22;}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';measure();}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){
 const rdt=Math.min(.05,(now-last)/1000);last=now;
 advance(rdt);
 if(state!=='pause')updCam(rdt);
 shake=Math.max(0,shake-rdt*30);
 render();updHUD();
 requestAnimationFrame(loop);
}
applyOpt();title();checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
requestAnimationFrame(loop);
</script>
