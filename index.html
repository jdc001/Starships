 .cards{display:contents}#pCard{grid-area:p;width:auto}#enemyCard{grid-area:e;width:auto}#trow{grid-area:t}#orders{grid-area:o}#fleetw{grid-area:f}
 #engBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:190px;z-index:2}

@media (max-width:440px){#thr{width:36px}#thrT{height:96px}#weap{grid-template-columns:repeat(2,58px);gap:5px}.wb{width:58px;height:58px}.mb{width:38px;height:38px}.pcol,.crew{width:30px}.pcols,.crow{gap:5px}#power{padding:6px}#shw{width:84px;transform:scale(.92);transform-origin:bottom center}#bot{gap:4px}}

  case'import':{let d=null;try{d=sanitize(JSON.parse(decodeURIComponent(escape(atob($('#codebox').value.trim())))));}catch(e){}
   if(!d){msg('THAT CODE ISN\'T A VALID SAVE','#ff6b5a');break;}save=d;persist();gal.sel=-1;titleBack='hub';msg('CAMPAIGN LOADED','#7dffb0');hub();break;}
  case'wipe':show(`<h2>DELETE EVERYTHING?</h2><p style="font-size:14px;opacity:.8">This erases your campaign, all save slots and your options from this device. It cannot be undone.</p><button class="btn" data-act="wipe2">DELETE</button><button class="btn alt" data-act="options">CANCEL</button>`);break;
  case'wipe2':try{localStorage.removeItem(KEY);for(let i=1;i<=SLOTS;i++)localStorage.removeItem(slotKey(i));localStorage.removeItem(OPT_KEY);}catch(e){}
   OPT={sound:true,vol:.7,shake:true,turn:6,fast:false,hints:true};applyOpt();try{localStorage.removeItem(OPT_KEY);}catch(e){}save=defSave();title();break;
    case'yard':yardTab='ship';yard();$('#scrBox').scrollTop=0;break;
  case'selship':save.sel=+arg;if(yardTab==='buy')yardTab='ship';yard();break;
  case'buyq':{const X=HULLS[arg],p=price(X.price);if(!unlocked('hull',arg)||save.fleet.length>=MAXFLEET||p>save.credits)return;
   show(`<h2>BUY A ${X.name.toUpperCase()}?</h2><img src="${shipPic('line',arg,'95,227,255')}" style="width:200px;display:block;margin:6px auto">
   <div class="stats"><div><span>Price</span><span class="cr">${p.toLocaleString()} cr</span></div><div><span>Your credits</span><span>${save.credits.toLocaleString()} cr</span></div><div><span>Left after</span><span class="cr">${(save.credits-p).toLocaleString()} cr</span></div><div><span>Hangar</span><span>${save.fleet.length+1}/${MAXFLEET}</span></div></div>
   <button class="btn gold" data-act="buyship" data-arg="${arg}">BUY IT</button><button class="btn alt" data-act="tab" data-arg="buy">CANCEL</button>`);break;}
  case'tradepick':{const X=HULLS[arg],p=price(X.price);if(!unlocked('hull',arg))return;
   show(`<h2>TRADE IN FOR A ${X.name.toUpperCase()}</h2><div class="tag">PRICE ${p.toLocaleString()} CR · YOU HAVE ${save.credits.toLocaleString()} CR</div><p style="font-size:13px;opacity:.8">Choose the ship you want to hand over. It goes with everything fitted to it, and its value comes off the price.</p>
   ${save.fleet.map((f,i)=>{const v=sellVal(f),net=p-v,ok=net<=save.credits;return`<div class="row"><div class="t"><b>${f.n.toUpperCase()}</b><span style="font-size:12px;opacity:.65">${HULLS[f.lo.hull].name.toUpperCase()}${f.wreck?' · WRECK':f.dmg>.005?' · '+Math.round(100-f.dmg*100)+'%':''}</span></div>
    <div style="display:flex;gap:10px;align-items:center"><img src="${shipPic('line',f.lo.hull,'95,227,255',f.lo.mounts.filter(m=>m.t))}" style="width:110px;opacity:${f.wreck?.35:1}"><p style="margin:0">Trade-in value <b class="cr">${v.toLocaleString()} cr</b><br>${net>=0?`You pay <b class="cr">${net.toLocaleString()} cr</b>`:`You get back <b class="cr">${(-net).toLocaleString()} cr</b>`}</p></div>
    <button class="btn sm ${ok?'gold':''}" data-act="tradeq" data-arg="${arg}:${i}" ${ok?'':'disabled'}>${ok?'TRADE THIS SHIP':'NOT ENOUGH CREDITS'}</button></div>`;}).join('')}
   <button class="btn alt" data-act="tab" data-arg="buy">CANCEL</button>`);break;}
  case'tradeq':{const[hk,si]=arg.split(':'),f=save.fleet[+si],X=HULLS[hk],p=price(X.price),v=sellVal(f),net=p-v;if(!f||net>save.credits)return;
   show(`<h2>CONFIRM TRADE-IN</h2><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0"><img src="${shipPic('line',f.lo.hull,'95,227,255',f.lo.mounts.filter(m=>m.t))}" style="width:120px;opacity:.7"><b style="font-size:22px;color:#ffe066">→</b><img src="${shipPic('line',hk,'95,227,255')}" style="width:120px"></div>
   <div class="stats"><div><span>You hand over</span><span>${f.n} (${HULLS[f.lo.hull].name})</span></div><div><span>Trade-in value</span><span class="cr">${v.toLocaleString()} cr</span></div><div><span>${X.name} price</span><span class="cr">${p.toLocaleString()} cr</span></div>
   <div><span>${net>=0?'You pay':'You get back'}</span><span class="cr">${Math.abs(net).toLocaleString()} cr</span></div><div><span>Credits after</span><span class="cr">${(save.credits-net).toLocaleString()} cr</span></div></div>
   <p style="font-size:13px;opacity:.8">The new ${X.name} keeps the name ${f.n} and comes with stock weapons. Upgrades, weapons and modules on the old ship go with it.</p>
   <button class="btn gold" data-act="tradeship" data-arg="${arg}">TRADE IT IN</button><button class="btn alt" data-act="tradepick" data-arg="${hk}">BACK</button>`);break;}
  case'tradeship':{const[hk,si]=arg.split(':'),i=+si,f=save.fleet[i],p=price(HULLS[hk].price),net=p-(f?sellVal(f):0);if(!f||!unlocked('hull',hk)||net>save.credits)return;
   save.credits-=net;save.fleet[i]={n:f.n,lo:newLo(hk),dmg:0,wreck:0};save.sel=i;persist();msg(f.n.toUpperCase()+' IS NOW A '+HULLS[hk].name.toUpperCase(),'#ffe066');yardTab='ship';yard();$('#scrBox').scrollTop=0;break;}
  case'buyship':{if(!unlocked('hull',arg)||save.fleet.length>=MAXFLEET)return;const p=price(HULLS[arg].price);if(p>save.credits)return;save.credits-=p;save.fleet.push(newShipRec(arg));save.sel=save.fleet.length-1;persist();msg('NEW SHIP: '+curShip().n.toUpperCase()+' · '+HULLS[arg].name.toUpperCase(),'#ffe066');yardTab='ship';yard();$('#scrBox').scrollTop=0;break;}
  case'sellship':{if(save.fleet.length<2)return;show(`<h2>${cf.wreck?'SCRAP':'SELL'} ${cf.n.toUpperCase()}?</h2><p style="font-size:14px;opacity:.8">You get ${sellVal(cf).toLocaleString()} cr for the ${HULLS[lo.hull].name} and everything fitted to it.</p><button class="btn" data-act="sellship2">${cf.wreck?'SCRAP':'SELL'}</button><button class="btn alt" data-act="yard">CANCEL</button>`);break;}
  case'sellship2':{if(save.fleet.length<2)return;save.credits+=sellVal(cf);save.fleet.splice(save.sel,1);save.sel=0;persist();yardTab='ship';yard();break;}
  case'repair':case'brepair':{const f=save.fleet[+arg],c=f?repairCost(f):0;if(!f||f.wreck||c>save.credits)return;save.credits-=c;f.dmg=0;persist();a==='repair'?yard():briefScreen();break;}
  case'salvage':case'bsalvage':{const f=save.fleet[+arg],c=f?salvageCost(f):0;if(!f||!f.wreck||c>save.credits)return;save.credits-=c;f.wreck=0;f.dmg=0;persist();msg(f.n.toUpperCase()+' REBUILT','#7dffb0');a==='salvage'?yard():briefScreen();break;}
  case'bpick':{const i=+arg,k=brief.pick.indexOf(i);if(k>=0)brief.pick.splice(k,1);else{if(brief.pick.length>=MAXDEPLOY){msg('UP TO '+MAXDEPLOY+' SHIPS PER MISSION','#ff9a6b');return;}brief.pick.push(i);}briefScreen();break;}
  case'launch':{const c=brief.c;if(!c||!brief.pick.length)return;if(MT[c.type].lander&&!brief.pick.some(i=>save.fleet[i].lo.hull==='lander'))return;initAudio();start(c,brief.pick.slice());break;}
  case'tab':yardTab=arg;yard();$('#scrBox').scrollTop=0;break;
  case'upg':{const c=UPC[lo.upg[arg]];if(c>save.credits)return;save.credits-=c;lo.upg[arg]++;persist();yard();break;}
  case'tier':{const m=lo.mounts[+arg],c=TIERC[m.tier-1];if(c>save.credits)return;save.credits-=c;m.tier++;persist();yard();break;}
  case'setw':{const[i,t]=arg.split(':');if(!unlocked('wpn',t))return;const m=lo.mounts[+i],ref=Math.round(mountVal(m)*.5),c=WD[t].price;if(c>save.credits+ref)return;save.credits+=ref-c;lo.mounts[+i]={t,tier:1,stock:0};if(t==='torp')lo.mounts[+i].v='fusion';persist();yard();break;}
  case'setv':{const[i,v]=arg.split(':');if(!unlocked('tv',v))return;const m=lo.mounts[+i],c=TV[v].price-Math.round(tvOf(m).price*.5);if(c>save.credits)return;save.credits-=c;m.v=v;persist();yard();break;}
  case'mount':{const c=MC[lo.extra];if(c>save.credits)return;save.credits-=c;lo.extra++;lo.mounts.push({t:null,tier:1,stock:0});persist();yard();break;}
  case'buymod':{const M=MODS[arg];if(!unlocked('mod',arg))return;if(M.price>save.credits||lo.mods.length>=HULLS[lo.hull].mods)return;save.credits-=M.price;lo.mods.push(arg);persist();yard();break;}
  case'sellmod':{save.credits+=Math.round(MODS[arg].price/2);lo.mods=lo.mods.filter(k=>k!==arg);persist();yard();break;}
  case'resume':$('#scr').classList.remove('on');state=prevState;last=performance.now();break;
  case'retreat':$('#scr').classList.remove('on');endBattle({win:false,retreat:true});break;
  case'opt:sound':OPT.sound=!OPT.sound;applyOpt();optionsScreen();break;
  case'opt:vol-':OPT.vol=Math.max(0,Math.round((OPT.vol-.1)*10)/10);applyOpt();optionsScreen();break;
  case'opt:vol+':OPT.vol=Math.min(1,Math.round((OPT.vol+.1)*10)/10);applyOpt();optionsScreen();break;
  case'opt:shake':OPT.shake=!OPT.shake;applyOpt();optionsScreen();break;
  case'opt:turn4':case'opt:turn6':case'opt:turn8':OPT.turn=+a.slice(8);applyOpt();optionsScreen();break;
  case'opt:fast0':case'opt:fast1':OPT.fast=a==='opt:fast1';applyOpt();optionsScreen();break;
  case'opt:hints':OPT.hints=!OPT.hints;applyOpt();optionsScreen();break;
  case'reset':show(`<h2>RESET CAMPAIGN?</h2><p style="font-size:14px;opacity:.8">This wipes your credits, ship, reputation and the galaxy.</p><button class="btn" data-act="reset2">YES, RESET</button><button class="btn alt" data-act="hub">CANCEL</button>`);break;
  case'reset2':newGame();break;
 }
}
$('#scrBox').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg);});

/* ================= INPUT / LOOP ================= */
let dragWP=-1,addWP=false;
function setWP(e,first){if(state!=='plan'||!player)return;
 const x0=(e.clientX-camO.x)/cam.z,y0=(e.clientY-camO.y)/cam.z,near=(o,px)=>Math.hypot(e.clientX-(camO.x+o.x*cam.z),e.clientY-(camO.y+o.y*cam.z))<Math.max(px||34,(o.rad||0)*cam.z+22);
 const P=player;
 if(first){dragWP=-1;
  if(P.alive&&P.act==='fold'&&!P.auto){let x=x0,y=y0;const r=Math.hypot(x,y);if(r>ARENA*.95){x*=ARENA*.95/r;y*=ARENA*.95/r;}P.foldTo={x,y};wpPulse=1;return;}
  // tap one of your ships to select it
  const f=fleet.find(s=>s.alive&&s!==P&&near(s));if(f){select(f);return;}
  // tap an enemy to make it the target; the course stays as it is
  const t=ships.find(o=>o.alive&&o.team==='e'&&o.vis.p&&!isOn(o,'cloak')&&near(o))||ships.find(o=>o.alive&&o.team==='e'&&!o.vis.p&&o.ctm.p&&near(o.ctm.p));
  if(t&&P.alive){setTarget(P,t);return;}
  if(!P.alive)return;
  if(P.auto){P.auto=false;updFleetBar(true);}
  // grab an existing waypoint to move it; tap the last one to switch between sailing through and stopping there
  if(P.ps.k==='manual'&&P.wps&&P.wps.length){const k=P.wps.findIndex(w=>near(w,26));
   if(k>=0){dragWP=k;dragMoved=false;dragStart={x:e.clientX,y:e.clientY};return;}}
  let x=x0,y=y0;const r=Math.hypot(x,y);if(r>ARENA){x*=ARENA/r;y*=ARENA/r;}
  if(P.ps.k!=='manual'){setPat(P,'manual');P.wps=[];msg(uname(P)+' · MANUAL COURSE · TAP + WAYPOINT TO ADD MORE','#5fe3ff');}
  if(addWP&&P.wps.length<5){P.wps.push({x,y});addWP=false;updCrs();}else{P.wps=[{x,y}];}
  P.wpDone=false;P.wpHold=false;dragWP=P.wps.length-1;dragMoved=true;wpPulse=1;syncWP(P);return;}
 if(dragWP<0||!P.alive||!P.wps||!P.wps[dragWP])return;
 if(!dragMoved&&Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)<8)return;dragMoved=true;
 let x=x0,y=y0;const r=Math.hypot(x,y);if(r>ARENA){x*=ARENA/r;y*=ARENA/r;}P.wps[dragWP]={x,y};P.wpDone=false;syncWP(P);}
let dragMoved=false,dragStart={x:0,y:0};
function syncWP(s){if(s.wps&&s.wps.length){s.wp.x=s.wps[0].x;s.wp.y=s.wps[0].y;}updCrs();}
// a tap on a waypoint without dragging it
function wpTapEnd(){const P=player;if(!P||dragWP<0||dragMoved||!P.wps)return;if(dragWP===P.wps.length-1){P.wpStop=!P.wpStop;msg(P.wpStop?uname(P)+' WILL STOP AT THE LAST WAYPOINT AND FACE ITS TARGET':uname(P)+' WILL SAIL THROUGH THE LAST WAYPOINT','#5fe3ff');}
 else{P.wps.splice(dragWP,1);msg('WAYPOINT REMOVED','#5fe3ff');syncWP(P);}wpPulse=1;}
function setTarget(P,t){P.tgt=t;enemy=t;if(P.auto){P.auto=false;updFleetBar(true);}wpPulse=1;msg(uname(P)+' TARGETING '+uname(t)+(P.focus?' · FOCUSED FIRE':''),'#ffe066');}
// cycle the selected ship's target through everything you know about
function cycleTarget(d){const P=player;if(!P||!P.alive)return;const L=ships.filter(o=>o.alive&&o.team==='e'&&(o.vis.p||(o.ctm.p&&ctAge('p',o)<TURN*5))).sort((a,b)=>dist(P,a.vis.p?a:a.ctm.p)-dist(P,b.vis.p?b:b.ctm.p));
 if(!L.length){msg('NO TARGETS IN SIGHT','#ff9a6b');return;}const i=L.indexOf(P.tgt);setTarget(P,L[(i+d+L.length)%L.length]);}
function updCrs(){const b=$('#crsBtn');if(!b)return;const m=player&&player.alive&&!player.auto&&player.ps.k==='manual'&&state==='plan';b.style.display=m?'':'none';b.classList.toggle('on',addWP);b.textContent=addWP?'TAP MAP':'+ WAYPOINT';
 const f=$('#focusBtn');if(f&&player){f.textContent=player.focus?'FOCUS':'FREE';f.classList.toggle('on',!!player.focus);}}
$('#crsBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(state!=='plan'||!player)return;if(!player.wps||!player.wps.length){msg('TAP THE MAP TO START A COURSE FIRST','#ff9a6b');return;}if(player.wps.length>=5){msg('FIVE WAYPOINTS AT MOST','#ff9a6b');return;}addWP=!addWP;updCrs();if(addWP)msg('TAP THE MAP TO ADD A WAYPOINT','#5fe3ff');});
$('#tPrev').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();cycleTarget(-1);});
$('#tNext').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();cycleTarget(1);});
$('#focusBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!player)return;player.focus=!player.focus;updCrs();msg(player.focus?uname(player)+' FIRES ONLY ON ITS TARGET':uname(player)+' FIRES ON ANYTHING IN REACH, TARGET FIRST','#ffe066');});
// two fingers zoom the battle map; the first finger's tap is undone so a pinch never moves your ship
const ptrs=new Map();let pinch=null,undo=null;
function snapOrders(){if(!player)return null;return{p:player,wps:(player.wps||[]).map(w=>({x:w.x,y:w.y})),wpStop:player.wpStop,wp:{x:player.wp.x,y:player.wp.y},wpDone:player.wpDone,ps:Object.assign({},player.ps),tgt:player.tgt,foldTo:player.foldTo,auto:player.auto,thrAuto:player.thrAuto};}
function restoreOrders(u){if(!u||!u.p.alive)return;const p=u.p;if(player!==p)select(p);Object.assign(p,{wps:u.wps,wpStop:u.wpStop,wp:u.wp,wpDone:u.wpDone,ps:u.ps,tgt:u.tgt,foldTo:u.foldTo,auto:u.auto,thrAuto:u.thrAuto});enemy=u.tgt;updOrders();updFleetBar(true);}
cvs.addEventListener('pointerdown',e=>{if(state==='galaxy'){galTap(e);return;}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){dragging=false;if(state==='plan')restoreOrders(undo);undo=null;const[a,b]=[...ptrs.values()];pinch={d:Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),z:zoomMul,ov:overview};return;}
 if(ptrs.size>2)return;undo=state==='plan'?snapOrders():null;dragging=true;setWP(e,true);});
addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()],r=Math.hypot(a.x-b.x,a.y-b.y)/pinch.d;
  if(pinch.ov){if(r>1.08){overview=false;pinch.ov=false;pinch.z=.3/r;}else return;}
  zoomMul=clamp(pinch.z*r,.15,5);updMapBtn();return;}
 if(dragging&&player&&player.ps.k==='manual')setWP(e,false);});
function ptrUp(e){if(dragging&&!pinch&&ptrs.size===1)wpTapEnd();ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;dragging=false;dragWP=-1;}
addEventListener('pointerup',ptrUp);addEventListener('pointercancel',ptrUp);
cvs.addEventListener('wheel',e=>{if(!player)return;e.preventDefault();if(overview&&e.deltaY<0){overview=false;zoomMul=.3;}else zoomMul=clamp(zoomMul*Math.exp(-e.deltaY*.0015),.15,5);updMapBtn();},{passive:false});
// the whole battlefield at once
let overview=false,zoomMul=1;
function updMapBtn(){const b=$('#mapBtn');if(b){b.classList.toggle('on',overview);b.textContent=overview?'BACK':'MAP';}}
$('#mapBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!player)return;overview=!overview;zoomMul=1;updMapBtn();});
function measure(){if(state==='galaxy'){galGeom();return;}const t=$('#top').getBoundingClientRect(),b=$('#bot').getBoundingClientRect();if(!t.height)return;
 const ob=$('#orders');ob.style.setProperty('--ob',(H-b.top+6)+'px');const o=ob.getBoundingClientRect(),port=H>=W;
 hudTop=port?Math.max($("#trow").getBoundingClientRect().bottom,$("#fleetw").getBoundingClientRect().bottom):t.bottom;hudBot=port&&o.height?H-o.top:H-b.top;
 const ac=$('#acts').getBoundingClientRect();hudBotL=ac.height?H-ac.top+8:H*.22;
 const fw=(port?$('#fleetw'):$('#pats')).getBoundingClientRect();if(fw.height)msgEl.style.top=(fw.bottom+8)+'px';}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';measure();}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){
 const rdt=Math.min(.05,(now-last)/1000);last=now;
 advance(rdt);
 if(state!=='pause')updCam(rdt);
 shake=Math.max(0,shake-rdt*30);
 render();updHUD();
 requestAnimationFrame(loop);
}
applyOpt();title();checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
requestAnimationFrame(loop);
</script>
